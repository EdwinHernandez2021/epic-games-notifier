name: Notificador Epic Games

on:
  schedule:
    # Se ejecuta todos los jueves a las 16:00 UTC (11:00 AM hora local)
    - cron: '0 16 * * 4'
  workflow_dispatch: # Esto agrega un botón en GitHub para probarlo manualmente cuando quieras

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de extracción
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py